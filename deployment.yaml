apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: nginx-secure
spec:
  replicas: 3

  strategy:
    blueGreen:
      activeService: nginx-active
      previewService: nginx-preview
      autoPromotionEnabled: false
      
  selector:
    matchLabels:
      app: nginx-secure

  template:
    metadata:
      labels:
        app: nginx-secure
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault

      containers:
      - name: nginx
        image: nginxinc/nginx-unprivileged:mainline-alpine
        securityContext:
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
